<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Rikus Pretorius: full-stack developer and UX designer">
<title>Rikus Pretorius: full-stack developer and UX designer</title>
<rect x="0.5" y="0.5" width="839" height="219" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<style>
  .w { opacity: 0; animation: cycle 15s infinite; }
  @keyframes cycle { 0% { opacity: 0; transform: translateY(8px); } 2% { opacity: 1; transform: none; } 18.0% { opacity: 1; transform: none; } 20.0% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 0; } }
  .spin { animation: spin 24s linear infinite; transform-origin: 112px 110px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dot { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rm-show { opacity: 1 !important; } .rm-hide { opacity: 0 !important; } }
</style>
<defs><clipPath id="av"><circle cx="112" cy="110" r="61"/></clipPath></defs>
<g class="spin">
  <circle cx="112" cy="110" r="70" fill="none" stroke="#5B2A9E" stroke-width="5" stroke-linecap="round" stroke-dasharray="132.6 307.2" transform="rotate(-90 112 110)"/>
  <circle cx="112" cy="110" r="70" fill="none" stroke="#B5371F" stroke-width="5" stroke-linecap="round" stroke-dasharray="132.6 307.2" transform="rotate(30 112 110)"/>
  <circle cx="112" cy="110" r="70" fill="none" stroke="#1F6FD1" stroke-width="5" stroke-linecap="round" stroke-dasharray="132.6 307.2" transform="rotate(150 112 110)"/>
</g>
<image href="data:image/jpeg;base64," x="51" y="49" width="122" height="122" clip-path="url(#av)" preserveAspectRatio="xMidYMid slice"/>
<text x="214" y="62" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#59636e">HELLO, I'M</text>
<text x="212" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#1f2328">Rikus Pretorius</text>
<text x="214" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#1f2328">I build</text>
  <text class="w rm-show" style="animation-delay:0s" x="294" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#9A6700">full-stack products, end to end.</text>
  <text class="w rm-hide" style="animation-delay:3s" x="294" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#5B2A9E">desktop apps on .NET and Electron.</text>
  <text class="w rm-hide" style="animation-delay:6s" x="294" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#B5371F">mobile apps with React Native.</text>
  <text class="w rm-hide" style="animation-delay:9s" x="294" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1F6FD1">AI-native interfaces people trust.</text>
  <text class="w rm-hide" style="animation-delay:12s" x="294" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#9A6700">accessible, considered UX.</text>
<line x1="214" y1="160" x2="808" y2="160" stroke="#eaeef2"/>
<circle class="dot" cx="220" cy="185" r="4" fill="#9A6700"/>
<text x="232" y="189" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#59636e">Interactive Development + UX Design · Open Window · Class of 2026</text>
</svg>
